version: '3.9'

networks:
  mongo-nw:
    name: mongo-network
services:
  health-data-access:
    image: harbor.devops-d2.eurodyn.com/healthdata/health-data-access:latest
    container_name: health-data-access
    logging:
      options:
        max-size: "50m"
    networks:
      mongo-nw: {}
    build: ./
    depends_on:
      - mongodb
    environment:
      - JAVA_OPTS=-Xms300m -Xmx1g
      - MONGO_DB_URI=mongodb://mongodb:27017
      - MONGO_DB=healthData-DataAccessDB
      - MONGO_USER=''
      - MONGO_PW=''
      - HTTP_PORT=8080
      - API_KEY=0e3296cb-5106-4d77-9e9d-25ef9b6eac71
      - HUB_STORE_UPLOAD_DATA_URL = http://localhost:8081/data
      - HUB_STORE_BEARER = eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpYXQiOjE2MTk3NjgyNDAsImV4cCI6NDgwNjk3ODAwNiwicmVhbG1fYWNjZXNzIjp7InJvbGVzIjpbInByb3ZpZGVyIl19fQ.WnGJHZaLYSKwyfMHuErCCj4V7sWBoh2Me3vxrAbwYdM
    ports:
      - "8081:8080"

  mongodb:
    image: mongo:4.0-xenial
    container_name: mongodb
    logging:
      options:
        max-size: "50m"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      mongo-nw: {}

volumes:
  mongo_data:

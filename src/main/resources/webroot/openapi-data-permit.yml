        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{id}/export/{type}/{lg}:
    get:
      summary: Export on Pdf or World on Data Access Form list
      operationId: exportDataAccessApplication
      security:
        - BearerAuth: [ ]
      tags:
        - Data Access Application Form
      parameters:
        - name: id
          in: path
          description: ID of the resource to retrieve
          required: true
          schema:
            type: string
        - name: type
          in: path
          description: the type on which export of application
          required: true
          schema:
            type: string
        - name: lg
          in: path
          description: laughing of the resource to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns a Pdf or World containing the Data Access Form list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':

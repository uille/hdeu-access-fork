        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Data Access Form created. Returns the created Data Access Form
          content:
            application/json:
              schema:
                type: object  # Assuming that the response is a single object, not an array
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

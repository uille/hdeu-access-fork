  ###########################
  #  Section Edit Locking   #
  ###########################

  /applications/{type}/{id}/sections/{sectionId}/lock/acquire:
    post:
      tags:
        - Section Locking
      summary: Acquire a section edit lock
      description: |
        Atomically acquires a lease lock for the specified section.
        Returns 200 on success, 409 if the section is locked by another user/session.
        The same user in a different tab also gets a 409.
      operationId: acquireSectionLock
      security:
        - BearerAuth: [ ]
      parameters:
        - name: type
          in: path
          required: true
          description: Application type (DATA_ACCESS_APPLICATION or DATA_REQUEST_APPLICATION)
          schema:
            type: string
        - name: id
          in: path
          required: true
          description: Application ID
          schema:
            type: string
        - name: sectionId
          in: path
          required: true
          description: Section identifier (section1 through section10)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRequest'
      responses:
        '200':
          description: Lock acquired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockResponse'
        '400':
          description: Bad request
        '409':
          description: Lock conflict - section is locked by another user or same user in another tab
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockConflictResponse'
        '500':
          description: Internal Server Error

  /applications/{type}/{id}/sections/{sectionId}/lock/heartbeat:
    post:
      tags:
        - Section Locking
      summary: Renew a section edit lock (heartbeat)
      description: |
        Extends the lock expiry. Must be called every 30 seconds by the frontend.
        Returns 409 if the lock was lost (expired or stolen).
      operationId: heartbeatSectionLock
      security:
        - BearerAuth: [ ]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRequest'
      responses:
        '200':
          description: Lock renewed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  expiresAt:
                    type: string
                    format: date-time
        '400':
          description: Bad request
        '409':
          description: Lock lost
        '500':
          description: Internal Server Error

  /applications/{type}/{id}/sections/{sectionId}/lock:
    delete:
      tags:
        - Section Locking
      summary: Release a section edit lock
      operationId: releaseSectionLock
      security:
        - BearerAuth: [ ]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LockRequest'
      responses:
        '204':
          description: Lock released.
        '400':
          description: Bad request
        '500':
          description: Internal Server Error

  /applications/{type}/{id}/sections/locks:
    get:
      tags:
        - Section Locking
      summary: Get all active locks for an application (polling fallback)
      description: |
        Returns all non-expired locks for the application. Used by the frontend
        as a polling fallback every 60-120 seconds.
      operationId: getApplicationSectionLocks
      security:
        - BearerAuth: [ ]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Array of active lock documents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SectionLock'
        '500':
          description: Internal Server Error

  /applications/{type}/{id}/lock/switch:
    post:
      tags:
        - Section Locking
      summary: Atomically switch the lock group when navigating between sections
      description: |
        Computes the new lock group for newSectionId, diffs against the session's
        current locks, releases stale sections, keeps overlapping ones (refreshing
        their expiry), and acquires newly required sections. If any new section is
        held by another user, returns 409 and keeps existing locks unchanged.
      operationId: switchSectionLock
      security:
        - BearerAuth: [ ]
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchLockRequest'
      responses:
        '200':
          description: Lock group switched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SwitchLockResponse'
        '400':
          description: Bad Request — missing sessionId or newSectionId.
        '409':
          description: Conflict — a section in the new lock group is held by another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LockConflictResponse'
        '500':
          description: Internal Server Error


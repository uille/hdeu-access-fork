              schema:
                $ref: '#/components/schemas/getAuditLogResponse'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /admin/audit/submitDatasetAuditLog:
    post:
      tags:
        - Audit Logs
      summary: Submit a new dataset audit log. This api is exposed to dispatcher component in order to insert an audit log record in case that an application status is changed.
      operationId: submitDatasetAuditLog
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                datasetId:
                  type: string
                  description: The ID of the dataset being audited
                datasetAction:
                  type: string
                  description: The action performed on the dataset
                  enum:
                    - "create"
                    - "update"
                    - "delete"
                ncp:
                  type: string
                  description: The NCP (Network Control Point) associated with the audit
              required:
                - datasetId
                - ncp
              additionalProperties: false
      responses:
        '200':
          description: Successfully submitted the dataset audit log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '400':
          description: Bad request, invalid data or missing required fields
        '500':
          description: Internal server error


        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /admin/catalogue/{catalogueId}/data:
    get:
      tags:
        - Catalogue
      summary: Retrieve the file based on the provided data_id
      operationId: getRDFFileData
      security:
        - BearerAuth: [ ]
      parameters:
        - name: catalogueId
          in: path
          description: ID of the catalogue
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieve the file from the hub-store
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /admin/catalogue/{catalogueId}/metadata:
    get:
      tags:
        - Catalogue
      summary: Retrieve the metadata of the file based on the provided data_id
      operationId: getRDFFileMetadata
      security:
        - BearerAuth: [ ]
      parameters:
        - name: catalogueId
          in: path
          description: ID of the catalogue
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieve the metadata of the file from the hub-store
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /admin/catalogue/geographicalCoverage/{lg}:
    get:
      tags:
        - Catalogue
      summary: Get geographical coverage of existing catalogues
      operationId: getAllGeographicalCoverage
      security:
        - BearerAuth: [ ]
      parameters:
        - name: lg
          in: path
          description: language of the resource to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns a JSON object containing the geographical coverage list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad request
        '500':
          description: Internal Server Error

  #########
  #  User #
  #########

  /admin/users/search:
    post:
      tags:
        - User
      summary: Search users
      operationId: searchUsers
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          description: the size of the page
          schema:
            type: integer
        - name: page
          in: query
          description: the requested page
          schema:
            type: integer
        - name: sortBy
          in: query
          description: the requested sorting item
          schema:
            type: string
        - name: sortOrder
          in: query
          description: the requested sorting order
          schema:
            type: string
      responses:
        '200':
          description: Returns a JSON array containing the Users
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /admin/users/deleteUser/{username}/{userId}:
    delete:
      tags:
        - User
      summary: Delete a user
      operationId: adminDeleteUser
      security:
        - BearerAuth: []
      parameters:
        - name: username
          in: path
          description: The keycloak username of the user to delete.
          required: true
          schema:
            type: string
        - name: userId
          in: path
          description: The keycloak identifier of the user to delete.
          required: true
          schema:
            type: string
      responses:
        '204':
          description: User deleted successfully.
        '400':
          description: Bad request.
        '404':
          description: User not found.
        '500':
          description: Internal Server Error.
  /admin/users/updateRole/{operation}/{role}/{userId}:
    put:
      tags:
        - User
      summary: Update a user's roles
      operationId: updateUserRole
      security:
        - BearerAuth: []
      parameters:
        - name: operation
          in: path
          description: The role update operation to perform (e.g., "add" or "remove")
          required: true
          schema:
            type: string
        - name: role
          in: path
          description: The role name
          required: true
          schema:
            type: string
        - name: userId
          in: path
          description: The Keycloak identifier of the user to update.
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Roles updated successfully.
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Bad request.
        '404':
          description: User not found.
        '500':
          description: Internal Server Error.

  ################
  # Data Permit  #
  ################

  /data-permit/export:
    get:
      tags:
        - Data Permit
      summary: Download data-permit document
      operationId: downloadDataPermitDocument
      security: []
      responses:
        '200':
          description: A .docx document with the data permit template
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Used to indicate a downloadable file attachment
              schema:
                type: string
        '500':
          description: Internal Server Error

  ###################
  # Biennial Report #
  ###################

  /biennial-report/export:
    get:
      tags:
        - Biennial Report
      summary: Download biennial-report document
      operationId: downloadBiennialReportDocument
      security: [ ]
      responses:
        '200':
          description: A .docx document with the biennial report template
          content:
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
          headers:
            Content-Disposition:
              description: Used to indicate a downloadable file attachment
              schema:
                type: string
        '500':
          description: Internal Server Error


  ################
  # Payload      #
  ################
  /payload:
    put:
      tags:
        - Payload
      summary: Create a payload if name attribute doesn't exist, or update an existing one
      operationId: putPayload
      security:
        - ApiKeyAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  minLength: 1
                  description: The name of the payload file
                payload:
                  type: object
                  description: The payload information
              required:
                - name
                - payload
              additionalProperties: false
      responses:
        '201':
          description: Successfully submitted payload configuration
        '400':
          description: Bad request, invalid data or missing required fields
        '500':
          description: Internal server error
  /payload/{name}:
    get:
      tags:
        - Payload
      summary: Get the payload configuration based on name
      operationId: getPayload
      security: [ ]
      parameters:
        - name: name
          in: path
          description: the payload name to retrieve
          required: true
          schema:
            type: string
            minLength: 1
      responses:
        '200':
          description: Returns a JSON object containing the payload
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
        '500':
          description: Internal Server Error

  ##############################
  # DDA auth user dataset   ####
  ##############################
  /dda:
    post:
      tags: [DDA]
      summary: Create or update the dataset description for the authenticated user
      operationId: postDda
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DdaPayload'
      responses:
        '200':
          description: Successfully submitted dataset description for the authenticated user (update)
        '201':
          description: Successfully submitted dataset description for the authenticated user (create)
        '400':
          description: Bad request, invalid data or missing required fields
        '500':
          description: Internal server error

    get:
      tags: [DDA]
      summary: Get the dataset for the authenticated user
      operationId: getDda
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: The dataset description payload for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DdaPayload'
        '204':
          description: No dataset found for the authenticated user
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  ####################
  # Validate Dataset #
  ####################
  /validate-dataset:
    post:
      tags:
        - Validate Dataset
      summary: Validate a dataset
      operationId: validateDataset
      security: [ ]
      parameters:
        - name: accessLevel
          in: query
          description: The access level of the dataset to validate
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/turtle:
            schema:
              type: string
              description: The dataset to validate in Turtle format
      responses:
        '200':
          description: Successfully validated the dataset
          content:
            application/json:
              schema:
                type: object
                required:
                  - date
                  - result
                  - reports
                properties:
                  date:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp when the validation was performed
                  result:
                    type: string
                    enum:
                      - SUCCESS
                      - FAILURE
                    description: Overall outcome of the validation run
                  overview:
                    type: object
                    description: Summary information about the validation profile used
                    required:
                      - profileID
                    properties:
                      profileID:
                        type: string
                        description: Identifier of the SHACL profile applied
                  counters:
                    type: object
                    description: Counts of assertions, errors, and warnings
                    required:
                      - nrOfAssertions
                      - nrOfErrors
                      - nrOfWarnings
                    properties:
                      nrOfAssertions:
                        type: integer
                        description: Total number of SHACL assertions checked
                      nrOfErrors:
                        type: integer
                        description: Number of failed assertions (errors)
                      nrOfWarnings:
                        type: integer
                        description: Number of non-blocking warnings
                  context:
                    type: object
                    description: Extra contextual data (if any) from the validation engine
                    additionalProperties: true
                  reports:
                    type: object
                    description: Detailed report entries grouped by severity
                    properties:
                      error:
                        type: array
                        description: Detailed error entries
                        items:
                          type: object
                          required:
                            - description
                            - location
                          properties:
                            description:
                              type: string
                              description: Human-readable description of the error
                            location:
                              type: string
                              description: Path or shape where the error occurred
                            test:
                              type: string
                              description: The value that failed the test at this location
                      warning:
                        type: array
                        description: Detailed warning entries
                        items:
                          type: object
                          required:
                            - description
                            - location
                          properties:
                            description:
                              type: string
                              description: Human-readable description of the warning
                            location:
                              type: string
                              description: Path or shape where the warning occurred
                            test:
                              type: string
                              description: The value that triggered the warning at this location
                  name:
                    type: string
                    description: Logical name of the validation routine (e.g. “SHACL Validation”)
        '400':
          description: Bad request, invalid data or missing required fields
        '500':
          description: Internal server error

  #############
  # RDF Utils #
  #############
  /rdf/convert/rdf-xml:
    post:
      tags:
        - RDF
      summary: Convert RDF from JSON-LD to RDF/XML
      operationId: convertJsonLdToRdfXml
      security: [ ]
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              type: object
              description: RDF content in JSON-LD format
              additionalProperties: true
      responses:
        '200':
          description: RDF/XML serialization of provided JSON-LD
          content:
            application/rdf+xml:
              schema:
                type: string
        '400':
          description: Invalid JSON-LD syntax or empty payload
        '500':
          description: Conversion error

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    ApiKeyExportAuth:
      type: apiKey
      in: header
      name: X-EXPORT-API-Key
  schemas:

    basket:
      type: object
      properties:
        dataset_id:
          type: string
        distribution_id:
          type: string
      required:
        - dataset_id
        - distribution_id

    resultMessage:
      type: object
      properties:
        result_message:
          type: string

    getBasketResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BasketItem'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    BasketItem:
      type: object
      properties:
        _id:
          type: string
        dataset_id:
          type: string
          format: uuid
        publisher:
          type: string
        userId:
          type: string
        date_added:
          type: string
          format: date-time
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/DistributionItem'

    DistributionItem:
      type: object
      properties:
        distribution_id:
          type: string
          format: uuid

    PaginationMetadata:
      type: object
      properties:
        total_documents:
          type: integer
        total_documents_filtered:
          type: integer
        page_size:
          type: integer
        current_page:
          type: integer
        total_pages:
          type: integer
        sort_by:
          type: string
        sort_order:
          type: string
          enum: [ asc, desc ]

    distributionCountResponse:
      type: object
      properties:
        distribution_count:
          type: integer

    getAuditLogResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogItem'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    AuditLogItem:
      type: object
      properties:
        _id:
          type: string
        date:
          type: string
          format: date-time
        object:
          type: string
        objectId:
          type: string
          nullable: true
        action:
          type: string
        actionDescription:
          type: string
        userId:
          type: string
        linkable:
          type: boolean
        name:
          type: string

    KeyValue:
      type: object
      properties:
        key:
          type: string
          description: Machine-readable code or identifier
        value:
          type: string
          description: Human-readable label

    Phone:
      type: object
      properties:
        countryCode:
          type: string
          description: Country calling code (e.g., "359")
        number:
          type: string
          description: Phone number without country code

    userProfile:
      type: object
      required:
        - legalOrNaturalPerson
      properties:
        legalOrNaturalPerson:
          $ref: '#/components/schemas/KeyValue'
        legalPersonOrganisationName:
          type: string
        legalPersonBusinessID:
          type: string
        legalPersonOperatorID:
          type: string
        legalPersonAddress:
          type: string
        legalPersonZipCode:
          type: string
        legalPersonCity:
          type: string
        legalPersonCountry:
          $ref: '#/components/schemas/KeyValue'
        legalPersonPhone:
          $ref: '#/components/schemas/Phone'

    userProfileResponse:
      allOf:
        - $ref: '#/components/schemas/userProfile'
        - type: object
          properties:
            date_modified:
              type: string
              format: date-time
              description: Last time the profile was modified (ISO 8601 format)

    dispatcherDecisionRequest:
      type: object
      required:
        - type
        - operation
        - objectId
        - payload
      properties:
        type:
          type: string
          enum: [ application ]
        operation:
          type: string
          enum: [ decision ]
        objectId:
          type: string
          minLength: 1
        payload:
          type: object
          required:
            - applicationType
            - catalogId
            - decisions
          properties:
            applicationType:
              type: string
              enum: [ DATA_ACCESS_APPLICATION, DATA_REQUEST_APPLICATION ]
            catalogId:
              type: string
              minLength: 1
            decisions:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - publisher
                  - decision
                properties:
                  publisher:
                    type: string
                    minLength: 1
                  decision:
                    type: string
                    minLength: 1

    DispatcherMessage:
      type: object
      properties:
        application_id:
          type: string
          description: ID of the application
        data_permit_id:
          type: string
          description: ID of the associated data permit
        catalog_ids:
          type: array
          items:
            type: string
          description: List of related catalog IDs
        status:
          type: string
          description: Current status of the dispatch result
      required:
        - application_id
        - data_permit_id
        - catalog_ids
        - status

    DispatcherMessages:
      type: array
      items:
        $ref: '#/components/schemas/DispatcherMessage'

    DeleteApplicationResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the operation was successful
        result:
          type: object
          properties:
            id:
              type: string
              description: ID of the deleted application

    Distribution:
      type: object
      properties:
        distribution_id:
          type: string
          format: uuid
          description: ID of the distribution
      required:
        - distribution_id

    DatasetItem:
      type: object
      properties:
        dataset_id:
          type: string
          format: uuid
          description: ID of the dataset
        catalog_id:
          type: string
          format: uuid
          description: ID of the catalog
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/Distribution'
      required:
        - dataset_id
        - catalog_id
        - distributions

    CreateDataRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the request
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DatasetItem'
        inputLanguage:
          type: string
          description: The input language of the user
      required:
        - title
        - datasets

    CreateDataResponse:
      type: object
      properties:
        result_message:
          type: string
          description: A message describing the result of the operation
        id:
          type: string
          description: ID of the newly created document

    ApplicationItem:
      type: object
      properties:
        application_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
          description: ID of the application
      required:
        - application_id

    UpdateDistribution:
      type: object
      properties:
        distribution_id:
          type: string
          format: uuid
          description: ID of the distribution
      required:
        - distribution_id

    UpdateDatasetItem:
      type: object
      properties:
        dataset_id:
          type: string
          format: uuid
          description: ID of the dataset
        catalog_id:
          type: string
          format: uuid
          description: ID of the catalog
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/UpdateDistribution'
      required:
        - dataset_id
        - catalog_id
        - distributions

    UpdateDatasetRequest:
      type: object
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationItem'
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/UpdateDatasetItem'
      required:
        - applications
        - datasets

    ApplicationSummary:
      type: object
      properties:
        _id:
          type: string
          format: uuid
          description: Unique identifier of the application
        version:
          type: string
          description: Version of the application
        title:
          type: string
          description: Title of the application
      required:
        - _id
        - version
        - title

    UpdateDatasetResponse:
      type: array
      items:
        $ref: '#/components/schemas/ApplicationSummary'

    DeleteDatasetItem:
      type: object
      additionalProperties: false
      properties:
        dataset_id:
          type: string
          description: Unique identifier of the dataset
      required:
        - dataset_id

    DeleteDatasetItemList:
      type: array
      items:
        $ref: '#/components/schemas/DeleteDatasetItem'

    DatasetDistributionItem:
      type: object
      additionalProperties: false
      properties:
        dataset_id:
          type: string
          description: Unique identifier of the dataset
        distribution_id:
          type: string
          description: Unique identifier of the distribution
      required:
        - dataset_id
        - distribution_id

    DeleteDatasetDistributionItemList:
      type: array
      items:
        $ref: '#/components/schemas/DatasetDistributionItem'

    PutStatusRequest:
      type: object
      properties:
        status:
          type: string
          minLength: 1
          description: Status code or label (must be at least 1 character)
        comment:
          type: string
          description: Optional comment providing additional information
      required:
        - status

    ChangeTitleRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the object
      required:
        - title

    TranslationCallbackPayload:
      type: object
      required:
        - id
        - data
        - dict
      properties:
        id:
          type: string
          description: Mongo ID of the application
        data:
          type: object
          required:
            - applicationId
            - applicationType
          properties:
            applicationId:
              type: string
            applicationType:
              type: string
            documentName:
              type: string
            defaultLanguage:
              type: string
            targetLanguages:
              type: array
              items:
                type: string
        dict:
          type: object
          description: Translation content for each section or file
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              required:
                - translations
              properties:
                value:
                  type: string
                  description: Original text (form-only)
                sourceLanguage:
                  type: string
                  description: Source language of the content
                targetLanguages:
                  type: array
                  items:
                    type: string
                translations:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number

    DdaPayload:
      type: object
      description: The dataset description assistant payload saved per authenticated user.
      additionalProperties: false
      required: [datasetDescriptionAssistantAccessLevel, datasetDescriptionAssistantLanguage, datasetDescriptionAssistantFormData]
      properties:
        datasetDescriptionAssistantAccessLevel:
          type: string
          nullable: true
          description: Access level of the dataset (e.g., "public", "restricted"). May be null.
        datasetDescriptionAssistantLanguage:
          type: string
          nullable: true
          description: Language code (e.g., "en", "el"). May be null.
        datasetDescriptionAssistantFormData:
          type: object
          default: {}
          description: Arbitrary object representing the form data.
          additionalProperties: true

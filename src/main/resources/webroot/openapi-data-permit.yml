openapi: 3.0.3
info:
  version: ${project.version}
  title: Data Access Service
  x-logo:
    url: images/logo


tags:
  - name: Basket
    x-displayName: "Basket"
    description: Operations related to a Basket, like create/update/delete basket, get all datasets, get dataset by id, delete dataset by id and more...
  - name: Data Access Form
    x-displayName: "Data Access Form"
    description: Operations related to a Data Access Form, like create/update/delete an application, get an application by id, get/delete all applications, create/update/delete datasets and distributions of an application, upload file for an application, submit/update a section of an application, validate application and sections and more...
  - name: Data Request Form
    x-displayName: "Data Request Form"
    description: Operations related to a Data Request Form, like create/update/delete an application, get an application by id, get/delete all applications, create/update/delete datasets and distributions of an application, upload file for an application, submit/update a section of an application, validate application and sections and more...
  - name: Country
    x-displayName: "Countries"
    description: Operations related to countries, like retrieving a list of all european countries.
  - name: Translation
    x-displayName: "Translations"
    description: Operations related to translations, like retrieving the translation of a specific language for a specific section of the application.
  - name: Translation Callback
    x-displayName: "Translation Callback"
    description: Endpoint used to receive and handle translation results from the hub-translation service. Supports both form and file translations for applications.
  - name: User Profile
    x-displayName: "User Profile"
    description: Operations related to a user's profile, like get/create/delete a user profile.
  - name: User
    x-displayName: "User"
    description: Operations related to users, like search a user, delete a user or update a user's role. All these operations can only be performed by an administrator.
  - name: Dispatcher
    x-displayName: "Dispatcher"
    description: Operations related to Dispatcher component, like update the status of an application and receive the status of an ncp.
  - name: Document
    x-displayName: "Documents"
    description: Operations related to Document operations, like export an application into pdf or word.
  - name: Administration
    x-displayName: "Administration"
    description: Operations related to applications that can only be performed by an administrator, like get all applications or resubmit a failed application.
  - name: Audit Logs
    x-displayName: "Audit Logs"
    description: Operations related to Audit Logs that can only be performed by an administrator, like search audit logs with sorting and filtering and submit audit log from dispatcher.
  - name: Catalogue
    x-displayName: "Catalogues"
    description: Operations related to catalogues that can only be performed by an administrator, like create/update/delete catalogue, validate catalogue, get all catalogues, upload a catalogue file and more...
  - name: Data Permit
    x-displayName: "Data Permit"
    description: Operations related to a Data Permit, like download a data permit file.
  - name: Payload
    x-displayName: "Payload"
    description: Operations related to a Payload configuration, like create/update/get payload.
  - name: DDA
    x-displayName: "Dataset Description Assistant"
    description: Dataset Description Assistant per-user payload.
  - name: Validate Dataset
    x-displayName: "Validate Dataset"
    description: Validate dataset content.
  - name: RDF
    x-displayName: "RDF Utilities"
    description: Utility endpoints for RDF transformations.

security:
  - BearerAuth: []
paths:

  ##########
  # Basket #
  ##########

  /basket:
    put:
      tags:
        - Basket
      summary: Creates or updates one dataset to the basket having one distributionId
      operationId: putBasketDataset
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/basket'
      responses:
        '201':
          description: Provided Dataset has been added to the Basket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
    delete:
      tags:
        - Basket
      summary: Delete all datasets from the basket
      operationId: deleteBasketDatasets
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: Basket has been deleted.
        '500':
          description: Internal Server Error
    get:
      tags:
        - Basket
      summary: Retrieve all datasets from the basket with pagination
      operationId: getBasketDatasets
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          description: the size of the page
          schema:
            type: integer
        - name: page
          in: query
          description: the requested page
          schema:
            type: integer
        - name: sortBy
          in: query
          description: the requested sorting item
          schema:
            type: string
        - name: sortOrder
          in: query
          description: the requested sorting order
          schema:
            type: string
      responses:
        '200':
          description: Returns a json array containing the Dataset objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/getBasketResponse'
        '500':
          description: Internal Server Error
  /basket/{dataset_id}:
    get:
      tags:
        - Basket
      summary: Retrieve one dataset from the basket by providing the dataset id
      operationId: getBasketDatasetByDatasetId
      security:
        - BearerAuth: [ ]
      parameters:
        - name: dataset_id
          in: path
          description: ID of the basket dataset to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns the Dataset object.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasketItem'
        '404':
          description: Not found
        '500':
          description: Internal Server Error
    delete:
      tags:
        - Basket
      summary: Delete one dataset from the basket by providing the dataset id
      operationId: deleteBasketDatasetByDatasetId
      security:
        - BearerAuth: [ ]
      parameters:
        - name: dataset_id
          in: path
          description: ID of the basket dataset to delete
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Provided Dataset has been deleted from basket.
        '404':
          description: Provided Datasets were not found in Basket
        '500':
          description: Internal Server Error
  /basket/distribution:
    delete:
      tags:
        - Basket
      summary: Delete one distribution from a Dataset by providing the distribution id
      operationId: deleteDistributionByDistributionId
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/basket'
      responses:
        '200':
          description: Provided Distribution has been deleted from the Dataset.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /basket/distribution/count:
    get:
      tags:
        - Basket
      summary: Retrieve the count of all distributions for each dataset
      operationId: getDistributionCount
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Returns a json object containing the count number of all distributions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/distributionCountResponse'
        '500':
          description: Internal Server Error

  ###############
  # Data Access #
  ###############

  /data-access/application/{id}:
    get:
      tags:
        - Data Access Form
      summary: Get Data Access Form by providing the application id
      operationId: getDataAccessApplicationById
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          description: ID of the resource to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns the data access application form
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
    delete:
      tags:
        - Data Access Form
      summary: Delete a Data Access form by providing the application id
      operationId: deleteDataAccessApplicationById
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          description: ID of the resource to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns a json object with the result of the delete operation and the application id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteApplicationResponse'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /data-access/application:
    delete:
      tags:
        - Data Access Form
      summary: Delete All Data Access Applications
      operationId: deleteAllDataAccessApplications
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: Data Access Forms have been deleted
        '400':
          description: Bad request
        '404':
          description: Provided Data Access Forms were not found
        '500':
          description: Internal Server Error
    post:
      tags:
        - Data Access Form
      summary: Create a data access application
      operationId: postDataAccessApplication
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataRequest'
      responses:
        '201':
          description: Data Access Form created. Returns the created Data Access Form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDataResponse'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
    put:
      tags:
        - Data Access Form
      summary: Update a data access application
      operationId: putDataAccessApplication
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Data Access Form created. Returns the created Data Access Form
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
    get:
      tags:
        - Data Access Form
      summary: Get All Data Access Applications in a list
      operationId: getAllDataAccessApplications
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          description: the size of the page
          schema:
            type: integer
        - name: page
          in: query
          description: the requested page
          schema:
            type: integer
        - name: sortBy
          in: query
          description: the requested sorting item
          schema:
            type: string
        - name: sortOrder
          in: query
          description: the requested sorting order
          schema:
            type: string
        - name: status
          in: query
          description: the status of the application
          schema:
            type: string
      responses:
        '200':
          description: Returns a JSON array containing the Data Access Form list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /data-access/application/distributions:
    put:
      tags:
        - Data Access Form
      summary: Update multiple data access applications
      operationId: putDistributionsApplication
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetRequest'
      responses:
        '200':
          description: Updated data access applications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDatasetResponse'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /data-access/application/{application_id}/datasets:
    delete:
      tags:
        - Data Access Form
      summary: Delete a list of datasets of a specific application
      operationId: deleteDatasets
      security:
        - BearerAuth: [ ]
      parameters:
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDatasetItemList'
      responses:
        '200':
          description: Datasets have been deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{application_id}/distributions:
    delete:
      tags:
        - Data Access Form
      summary: Delete a list of dataset/distributions of a specific application
      operationId: deleteDistributions
      security:
        - BearerAuth: [ ]
      parameters:
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteDatasetDistributionItemList'
      responses:
        '200':
          description: Distributions have been deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{application_id}/section/{section_number}:
    put:
      tags:
        - Data Access Form
      summary: Update or create a section for the provided application
      operationId: putSectionApplication
      security:
        - BearerAuth: [ ]
      parameters:
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
        - name: section_number
          in: path
          description: the number of the section
          required: true
          schema:
            type: integer
            minimum: 1
            maximum: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                - type: array
                  items:
                    type: object
      responses:
        '200':
          description: Created or updated the provided section for the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    get:
      tags:
        - Data Access Form
      summary: Get a section for the provided application
      operationId: getSectionApplication
      security:
        - BearerAuth: [ ]
      parameters:
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
        - name: section_number
          in: path
          description: the number of the section
          required: true
          schema:
            type: integer
            minimum: 2
            maximum: 10
      responses:
        '200':
          description: Successfully got the section for the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{application_id}/section/{section_number}/validation:
    post:
      tags:
        - Data Access Form
      summary: Retrieve validation errors for a specific section using the given application id
      operationId: getSectionErrors
      security:
        - BearerAuth: [ ]
      parameters:
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
        - name: section_number
          in: path
          description: the number of the section
          required: true
          schema:
            type: integer
            minimum: 2
            maximum: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                - type: array
                  items:
                    type: object
      responses:
        '200':
          description: Successfully got the validation errors for a specific section using the given application ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{application_id}/data:
    post:
      tags:
        - Data Access Form
      summary: Upload a multipart file for the provided application
      operationId: postData
      security:
        - BearerAuth: [ ]
      parameters:
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
      responses:
        '201':
          description: Successfully uploaded the multipart file to the hub-store
        '400':
          description: Bad Request
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{application_id}/data/{data_id}:
    get:
      tags:
        - Data Access Form
      summary: Retrieve the file based on the provided file id
      operationId: getData
      security:
        - BearerAuth: [ ]
      parameters:
        - name: data_id
          in: path
          description: ID of the file
          required: true
          schema:
            type: string
            minLength: 1
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful file download
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
              example: file content in binary
          headers:
            Content-Disposition:
              description: Indicates if content should be displayed inline or as an attachment
              schema:
                type: string
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    delete:
      tags:
        - Data Access Form
      summary: Delete the file based on the provided file id
      operationId: deleteData
      security:
        - BearerAuth: [ ]
      parameters:
        - name: data_id
          in: path
          description: ID of the file
          required: true
          schema:
            type: string
            minLength: 1
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully delete the multipart file to the hub-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{application_id}/status:
    put:
      tags:
        - Data Access Form
      summary: Create or update the status of an application
      operationId: putStatusApplication
      security:
        - BearerAuth: [ ]
      parameters:
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutStatusRequest'
      responses:
        '200':
          description: Updated the provided status for the application
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{application_id}/title:
    put:
      tags:
        - Data Access Form
      summary: Update the title of an application
      operationId: putTitleApplication
      security:
        - BearerAuth: [ ]
      parameters:
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeTitleRequest'
      responses:
        '200':
          description: Updated the provided title for the application
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/resultMessage'
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{id}/export/{type}/{lg}/{tl}:
    get:
      tags:
        - Data Access Form
      summary: Export on Pdf or World on Data Access Form list
      operationId: exportDataAccessApplication
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          description: ID of the resource to retrieve
          required: true
          schema:
            type: string
        - name: type
          in: path
          description: the type on which export of application
          required: true
          schema:
            type: string
        - name: lg
          in: path
          description: laughing of the resource to retrieve
          required: true
          schema:
            type: string
        - name: tl
          in: path
          description: selected translated language
          required: true
          schema:
            type: string
      responses:
        '200':
          description: File download (PDF or DOCX)
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.wordprocessingml.document:
              schema:
                type: string
                format: binary
        '400':
          description: Bad request
        '500':
          description: Internal Server Error

  ################
  # Data Request #
  ################

  /data-request/application/{id}:
    get:
      tags:
        - Data Request Form
      summary: Get Data Request Form list
      operationId: getDataRequestApplicationById
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          description: ID of the resource to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns the data request application form
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
    delete:
      tags:
        - Data Request Form
      summary: Get Data Request Form list
      operationId: deleteDataRequestApplicationById
      security:
        - BearerAuth: [ ]
      parameters:
        - name: id
          in: path
          description: ID of the resource to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Returns a json object with the result of the delete operation and the application id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteApplicationResponse'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /data-request/application:
    delete:
      tags:
        - Data Request Form
      summary: Delete All Data Request Applications
      operationId: deleteAllDataRequestApplications
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: Data Request Forms have been deleted
        '400':
          description: Bad request
        '404':
          description: Provided Data Request Forms were not found
        '500':
          description: Internal Server Error
    post:
      tags:
        - Data Request Form
      summary: Create a data request application
      operationId: postDataRequestApplication
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDataRequest'
      responses:
        '201':
          description: Data Request Form created. Returns the created Data Request Form
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDataResponse'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
    put:
      tags:
        - Data Request Form
      summary: Create a data Request application
      operationId: putDataRequestApplication
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '201':
          description: Data Request Form created. Returns the created Data Request Form
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
    get:
      tags:
        - Data Request Form
      summary: Get All Data Request Applications list
      operationId: getAllDataRequestApplications
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          description: the size of the page
          schema:
            type: integer
        - name: page
          in: query
          description: the requested page
          schema:
            type: integer
        - name: sortBy
          in: query
          description: the requested sorting item
          schema:
            type: string
        - name: sortOrder
          in: query
          description: the requested sorting order
          schema:
            type: string
        - name: status
          in: query
          description: the status of the application
          schema:
            type: string
      responses:
        '200':
          description: Returns a JSON array containing the Data Request Form list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /data-request/application/distributions:
    put:
      tags:
        - Data Request Form
      summary: Update multiple data request applications
      operationId: putDistributionsDataRequestApplication
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDatasetRequest'
      responses:
        '201':
          description: Updated data request applications.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateDatasetResponse'
        '400':
          description: Bad request
        '500':
          description: Internal Server Error
  /data-request/application/{application_id}/datasets:
    delete:
      tags:
        - Data Request Form
      summary: Delete a list of datasets
      operationId: deleteDataRequestDatasets
      security:
        - BearerAuth: [ ]
      parameters:
        - name: application_id

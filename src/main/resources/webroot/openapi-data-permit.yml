      operationId: postData
      security:
        - BearerAuth: [ ]
      tags:
        - Data access application
      parameters:
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                data:
                  type: string
      responses:
        '201':
          description: Successfully uploaded the multipart file to the hub-store
          headers:
            Location:
              schema:
                type: string
              description: the location of the created resource
        '400':
          description: Bad Request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
  /data-access/application/{application_id}/data/{data_id}:

        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
        - name: section_number
          in: path
          description: the number of the section
          required: true
          schema:
            type: integer
            minimum: 2
            maximum: 10
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                - type: array
                  items:
                    type: object
      responses:

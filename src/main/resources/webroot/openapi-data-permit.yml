  /admin/applications/search:
    post:
      tags:
        - Administration
      summary: Search Data Access and Data Request applications for administrators
      operationId: searchAllApplicationsByAdmin
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          description: the size of the page
          schema:
            type: integer
        - name: page
          in: query
          description: the requested page
          schema:
            type: integer
        - name: sortBy
          in: query
          description: the requested sorting item
          schema:
            type: string
        - name: sortOrder
          in: query
          description: the requested sorting order
          schema:
            type: string
        - name: status
          in: query
          description: the status of the application. Multiple values can be provided comma-separated.
          schema:
            type: string
        - name: searchTerm
          in: query
          description: optional title search term when a request body is not provided
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                searchTerm:
                  type: string
                  description: case-insensitive title search term
                title:
                  type: string
                  description: alias of searchTerm for title-based filtering
                ownershipFilter:
                  type: string
                  description: filter applications by whether they currently have ownership requests
                  enum:
                    - all
                    - pending
                    - no-pending
      responses:
        '200':
          description: Returns a combined list of data access and data request applications
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        hasOwnershipRequests:
                          type: boolean
                          description: true when the application currently has at least one ownership request
                  metadata:
                    type: object
                    properties:
                      ownershipFilter:
                        type: string
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '500':
          description: Internal Server Error

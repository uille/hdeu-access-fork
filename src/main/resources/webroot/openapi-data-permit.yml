        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DdaPayload'
      responses:
        '200':
          description: Successfully submitted dataset description for the authenticated user (update)
        '201':
          description: Successfully submitted dataset description for the authenticated user (create)
        '400':
          description: Bad request, invalid data or missing required fields
        '500':
          description: Internal server error

    get:
      tags: [ DDA ]
      summary: Get the dataset for the authenticated user
      operationId: getDda
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: The dataset description payload for the authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DdaPayload'
        '204':
          description: No dataset found for the authenticated user
        '401':
          description: Unauthorized
        '500':
          description: Internal server error

  ####################
  # Validate Dataset #
  ####################
  /validate-dataset:
    post:
      tags:
        - Validate Dataset
      summary: Validate a dataset
      operationId: validateDataset
      security: [ ]
      parameters:
        - name: accessLevel
          in: query
          description: The access level of the dataset to validate
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          text/turtle:
            schema:
              type: string
              description: The dataset to validate in Turtle format
      responses:
        '200':
          description: Successfully validated the dataset
          content:
            application/json:
              schema:
                type: object
                required:
                  - date
                  - result
                  - reports
                properties:
                  date:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp when the validation was performed
                  result:
                    type: string
                    enum:
                      - SUCCESS
                      - FAILURE
                    description: Overall outcome of the validation run
                  overview:
                    type: object
                    description: Summary information about the validation profile used
                    required:
                      - profileID
                    properties:
                      profileID:
                        type: string
                        description: Identifier of the SHACL profile applied
                  counters:
                    type: object
                    description: Counts of assertions, errors, and warnings
                    required:
                      - nrOfAssertions
                      - nrOfErrors
                      - nrOfWarnings
                    properties:
                      nrOfAssertions:
                        type: integer
                        description: Total number of SHACL assertions checked
                      nrOfErrors:
                        type: integer
                        description: Number of failed assertions (errors)
                      nrOfWarnings:
                        type: integer
                        description: Number of non-blocking warnings
                  context:
                    type: object
                    description: Extra contextual data (if any) from the validation engine
                    additionalProperties: true
                  reports:
                    type: object
                    description: Detailed report entries grouped by severity
                    properties:
                      error:
                        type: array
                        description: Detailed error entries
                        items:
                          type: object
                          required:
                            - description
                            - location
                          properties:
                            description:
                              type: string
                              description: Human-readable description of the error
                            location:
                              type: string
                              description: Path or shape where the error occurred
                            test:
                              type: string
                              description: The value that failed the test at this location
                      warning:
                        type: array
                        description: Detailed warning entries
                        items:
                          type: object
                          required:
                            - description
                            - location
                          properties:
                            description:
                              type: string
                              description: Human-readable description of the warning
                            location:
                              type: string
                              description: Path or shape where the warning occurred
                            test:
                              type: string
                              description: The value that triggered the warning at this location
                  name:
                    type: string
                    description: Logical name of the validation routine (e.g. “SHACL Validation”)
        '400':
          description: Bad request, invalid data or missing required fields
        '500':
          description: Internal server error

  #############
  # RDF Utils #
  #############
  /rdf/convert/rdf-xml:
    post:
      tags:
        - RDF
      summary: Convert RDF from JSON-LD to RDF/XML
      operationId: convertJsonLdToRdfXml
      security: [ ]
      requestBody:
        required: true
        content:
          application/ld+json:
            schema:
              type: object
              description: RDF content in JSON-LD format
              additionalProperties: true
      responses:
        '200':
          description: RDF/XML serialization of provided JSON-LD
          content:
            application/rdf+xml:
              schema:
                type: string
        '400':
          description: Invalid JSON-LD syntax or empty payload
        '500':
          description: Conversion error

  #############
  # log level #
  #############
  /log-level:
    get:
      summary: Update log level dynamically
      description: >
        Changes the log level for a specific logger at runtime. The logger name and log level
        must be provided as query parameters.
      operationId: updateLogLevel
      security:
        - ApiKeyAuth: []
      parameters:
        - name: logger
          in: query
          required: true
          description: The name of the logger (e.g., `root` or package-specific logger name).
          schema:
            type: string
        - name: level
          in: query
          required: true
          description: The log level to set (e.g., `TRACE`, `DEBUG`, `INFO`, `WARN`, `ERROR`).
          schema:
            type: string
            enum: [ TRACE, DEBUG, INFO, WARN, ERROR ]
      responses:
        '200':
          description: Log level updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logLevelResponse'
        '400':
          description: Missing or invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logLevelRequest'
        '401':
          description: Unauthorized. API key is missing or invalid.
        '403':
          description: Forbidden.
        '404':
          description: Logger not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logLevelErrorResponse'
        '500':
          description: Error while updating log level.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/logLevelErrorResponse500'
  #####################
  #   Notifications   #
  #####################
  /notifications/getAll:
    post:
      tags:
        - Notifications
      summary: Get All Notifications
      operationId: getAllNotifications
      security:
        - BearerAuth: [ ]
      parameters:
        - name: limit
          in: query
          description: the size of the page
          schema:
            type: integer
        - name: page
          in: query
          description: the requested page
          schema:
            type: integer
        - name: sortBy
          in: query
          description: the requested sorting item
          schema:
            type: string
        - name: sortOrder
          in: query
          description: the requested sorting order
          schema:
            type: string
      responses:
        '200':
          description: Returns a JSON array containing the Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
        '400':
          description: Bad request
        '500':
          description: Internal Server Error

  /notifications/readNotifications:
    post:
      tags:
        - Notifications
      summary: Mark notifications as read based on list of IDs
      description: Updates the specified notifications by setting the 'displayed' flag from false to true.
      operationId: readNotifications
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notificationIds:
                  type: array
                  items:
                    type: string
              required:
                - notificationIds
      responses:
        '200':
          description: Notifications successfully marked as read
        '400':
          description: Bad request (invalid or empty IDs list)
        '500':
          description: Internal Server Error

  /notifications/unreadNotificationCounter:
    get:
      tags:
        - Notifications
      summary: Retrieve the count of all unread notifications
      operationId: getUnreadNotificationCount
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Returns a json object containing the count number of all unread notifications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/unreadNotificationCountResponse'
        '500':
          description: Internal Server Error

  /notifications/delete:
    post:
      tags:
        - Notifications
      summary: Delete Notifications based on a id or all of them
      operationId: deleteNotifications
      security:
        - BearerAuth: [ ]
      responses:
        '204':
          description: Notifications have been deleted
        '400':
          description: Bad request
        '500':
          description: Internal Server Error

  # ---------------------------------------------------------------------------
  # User Bootstrap
  # ---------------------------------------------------------------------------
  /me/bootstrap:
    post:
      tags:
        - User Profile
      summary: Bootstrap user on first login
      description: >
        Upserts the USER document with the email from the JWT token claims.
        Also resolves any pending email-based collaborator invitations for this user.
        Must be called once after authentication/app init from the frontend.
        Returns 400 if the token has no email claim (Keycloak mapper must be configured).
      operationId: bootstrapUser
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User bootstrapped (existing record updated)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '201':
          description: User record created
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: Token has no email claim
        '401':
          description: Unauthorized

  /applications/{type}/{id}/sections/{sectionId}/lock/release:
    post:
      tags:
        - Section Locking
      summary: Release a section lock
      description: >
        Explicitly releases the lock. Only the lock owner (same userId + sessionId) can release.
        If the lock has already expired the release is treated as a no-op (204).
        Uses POST (not DELETE) so that the request body (sessionId) is reliably transmitted
        through all HTTP proxies and load-balancers, which may strip DELETE request bodies.

        The sessionId may be provided in the JSON request body OR as the `sessionId` query
        parameter. The query parameter path is used by `sendBeacon` / `fetch(keepalive)` on
        browser tab/window close where body Content-Type may be mangled and the OpenAPI
        body validator would otherwise reject the request before it reaches the handler.
      operationId: releaseSectionLock
      security:
        - BearerAuth: []
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: sectionId
          in: path
          required: true
          schema:
            type: string
        - name: sessionId
          in: query
          required: false
          description: >
            Fallback for the JSON body sessionId. Used by browser unload-time requests
            (sendBeacon / fetch keepalive) where the body Content-Type may be mangled.
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
      responses:
        '204':
          description: Lock released (or already expired — idempotent)
        '400':
          description: Missing sessionId in both request body and query parameter
        '403':
          description: Caller does not own the lock
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
    ApiKeyExportAuth:
      type: apiKey
      in: header
      name: X-EXPORT-API-Key

  parameters:
    MongoID:
      name: id
      in: path
      description: ID of the favourite
      required: true
      schema:
        type: string

    FavouriteTypeParam:
      name: type
      in: query
      description: Filter favourites by type
      required: false
      schema:
        $ref: '#/components/schemas/FavouriteType'
      example: "dataset"

  schemas:
    NonBlankString:
      type: string
      minLength: 1
      pattern: '.*\S.*'

    basket:
      type: object
      properties:
        dataset_id:
          type: string
        distribution_id:
          type: string
      required:
        - dataset_id
        - distribution_id

    resultMessage:
      type: object
      properties:
        result_message:
          type: string

    getBasketResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BasketItem'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    BasketItem:
      type: object
      properties:
        _id:
          type: string
        dataset_id:
          type: string
          format: uuid
        publisher:
          type: string
        userId:
          type: string
        date_added:
          type: string
          format: date-time
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/DistributionItem'

    DistributionItem:
      type: object
      properties:
        distribution_id:
          type: string
          format: uuid

    PaginationMetadata:
      type: object
      properties:
        total_documents:
          type: integer
        total_documents_filtered:
          type: integer
        page_size:
          type: integer
        current_page:
          type: integer
        total_pages:
          type: integer
        sort_by:
          type: string
        sort_order:
          type: string
          enum: [ asc, desc ]

    unreadNotificationCountResponse:
      type: object
      properties:
        unread_notification_count:
          type: integer

    distributionCountResponse:
      type: object
      properties:
        distribution_count:
          type: integer

    getAuditLogResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditLogItem'
        metadata:
          $ref: '#/components/schemas/PaginationMetadata'

    AuditLogItem:
      type: object
      properties:
        _id:
          type: string
        date:
          type: string
          format: date-time
        object:
          type: string
        objectId:
          type: string
          nullable: true
        action:
          type: string
        actionDescription:
          type: string
        userId:
          type: string
        linkable:
          type: boolean
        name:
          type: string

    KeyValue:
      type: object
      properties:
        key:
          type: string
          description: Machine-readable code or identifier
        value:
          type: string
          description: Human-readable label

    Phone:
      type: object
      properties:
        countryCode:
          type: string
          description: Country calling code (e.g., "359")
        number:
          type: string
          description: Phone number without country code

    userProfile:
      type: object
      required:
        - email
        - legalOrNaturalPerson
      properties:
        email:
          type: string
        legalOrNaturalPerson:
          $ref: '#/components/schemas/KeyValue'
        legalPersonOrganisationName:
          type: string
        legalPersonBusinessID:
          type: string
        legalPersonOperatorID:
          type: string
        legalPersonAddress:
          type: string
        legalPersonZipCode:
          type: string
        legalPersonCity:
          type: string
        legalPersonCountry:
          $ref: '#/components/schemas/KeyValue'
        legalPersonPhone:
          $ref: '#/components/schemas/Phone'
        emailNotificationPreferences:
          $ref: '#/components/schemas/EmailNotificationPreferences'

    userProfileResponse:
      allOf:
        - $ref: '#/components/schemas/userProfile'
        - type: object
          properties:
            date_modified:
              type: string
              format: date-time
              description: Last time the profile was modified (ISO 8601 format)

    EmailNotificationPreferences:
      type: object
      required: [ enabled, reminders ]
      properties:
        enabled:
          type: boolean
        reminders:
          $ref: '#/components/schemas/EmailReminderPreferences'

    EmailReminderPreferences:
      type: object
      required: [ enabled ]
      properties:
        enabled:
          type: boolean
        offsetDays:
          type: array
          items:
            type: integer
            enum: [ 1, 10 ]

    FavouriteType:
      type: string
      description: Type of the entity that is marked as favourite
      enum:
        - dataset
        - distribution
        - sparqlQuery
        - datasetFilter

    NewFavouriteBase:
      type: object
      required:
        - type
      properties:
        type:
          $ref: '#/components/schemas/FavouriteType'

    FavouriteBase:
      type: object
      required:
        - _id
        - userId
        - type
        - createdAt
        - updatedAt
      properties:
        _id:
          type: string
          description: Unique ID of the favourite entry
          readOnly: true
        userId:
          type: string
          description: ID of the user to whom the favourite belongs
          readOnly: true
        type:
          $ref: '#/components/schemas/FavouriteType'
        createdAt:
          type: string
          format: date-time
          description: Timestamp of when the favourite was added
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          description: Timestamp of when the favourite was last updated
          readOnly: true

    FavouriteDatasetBase:
      type: object
      additionalProperties: false
      required:
        - type
        - objectId
      properties:
        type:
          type: string
          enum: [ dataset ]
          description: Type of the entity that is marked as favourite
        objectId:
          type: string
          format: uuid
          description: ID of the dataset that is marked as favourite
        content:
          $ref: '#/components/schemas/FavouriteSnapshotContent'

    FavouriteDistributionBase:
      type: object
      additionalProperties: false
      required:
        - type
        - objectId
        - parentId
      properties:
        type:
          type: string
          enum: [ distribution ]
          description: Type of the entity that is marked as favourite
        objectId:
          type: string
          format: uuid
          description: ID of the distribution that is marked as favourite
        parentId:
          type: string
          format: uuid
          description: ID of the dataset this distribution is part of
        content:
          $ref: '#/components/schemas/FavouriteSnapshotContent'

    FavouriteSparqlQueryBase:
      type: object
      additionalProperties: false
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum: [ sparqlQuery ]
          description: Type of the entity that is marked as favourite
        content:
          $ref: '#/components/schemas/SparqlQueryContent'

    FavouriteDatasetFilterBase:
      type: object
      additionalProperties: false
      required:
        - type
        - content
      properties:
        type:
          type: string
          enum: [ datasetFilter ]
          description: Type of the entity that is marked as favourite
        content:
          $ref: '#/components/schemas/DatasetFilterContent'

    NewFavouriteDataset:
      allOf:
        - $ref: '#/components/schemas/NewFavouriteBase'
        - $ref: '#/components/schemas/FavouriteDatasetBase'

    NewFavouriteDistribution:
      allOf:
        - $ref: '#/components/schemas/NewFavouriteBase'
        - $ref: '#/components/schemas/FavouriteDistributionBase'

    NewFavouriteSparqlQuery:
      allOf:
        - $ref: '#/components/schemas/NewFavouriteBase'
        - $ref: '#/components/schemas/FavouriteSparqlQueryBase'

    NewFavouriteDatasetFilter:
      allOf:
        - $ref: '#/components/schemas/NewFavouriteBase'
        - $ref: '#/components/schemas/FavouriteDatasetFilterBase'

    NewFavouriteEntry:
      oneOf:
        - $ref: '#/components/schemas/NewFavouriteDataset'
        - $ref: '#/components/schemas/NewFavouriteDistribution'
        - $ref: '#/components/schemas/NewFavouriteSparqlQuery'
        - $ref: '#/components/schemas/NewFavouriteDatasetFilter'
      discriminator:
        propertyName: type
        mapping:
          dataset: '#/components/schemas/NewFavouriteDataset'
          distribution: '#/components/schemas/NewFavouriteDistribution'
          sparqlQuery: '#/components/schemas/NewFavouriteSparqlQuery'
          datasetFilter: '#/components/schemas/NewFavouriteDatasetFilter'

    UpdateFavouriteEntry:
      oneOf:
        - $ref: '#/components/schemas/NewFavouriteSparqlQuery'
        - $ref: '#/components/schemas/NewFavouriteDatasetFilter'
      discriminator:
        propertyName: type
        mapping:
          sparqlQuery: '#/components/schemas/NewFavouriteSparqlQuery'
          datasetFilter: '#/components/schemas/NewFavouriteDatasetFilter'

    FavouriteDataset:
      allOf:
        - $ref: '#/components/schemas/FavouriteBase'
        - $ref: '#/components/schemas/FavouriteDatasetBase'

    FavouriteDistribution:
      allOf:
        - $ref: '#/components/schemas/FavouriteBase'
        - $ref: '#/components/schemas/FavouriteDistributionBase'

    FavouriteSparqlQuery:
      allOf:
        - $ref: '#/components/schemas/FavouriteBase'
        - $ref: '#/components/schemas/FavouriteSparqlQueryBase'

    FavouriteDatasetFilter:
      allOf:
        - $ref: '#/components/schemas/FavouriteBase'
        - $ref: '#/components/schemas/FavouriteDatasetFilterBase'

    Favourite:
      oneOf:
        - $ref: '#/components/schemas/FavouriteDataset'
        - $ref: '#/components/schemas/FavouriteDistribution'
        - $ref: '#/components/schemas/FavouriteSparqlQuery'
        - $ref: '#/components/schemas/FavouriteDatasetFilter'
      discriminator:
        propertyName: type
        mapping:
          dataset: '#/components/schemas/FavouriteDataset'
          distribution: '#/components/schemas/FavouriteDistribution'
          sparqlQuery: '#/components/schemas/FavouriteSparqlQuery'
          datasetFilter: '#/components/schemas/FavouriteDatasetFilter'

    FavouriteSnapshotContent:
      type: object
      additionalProperties: false
      properties:
        label:
          type: string
          description: Snapshot label used for display when the real entry is no longer available
        parentLabel:
          type: string
          description: Snapshot parent label used mainly for distribution favourites

    FavouritesResponse:
      type: array
      items:
        $ref: '#/components/schemas/Favourite'

    SparqlQueryContent:
      type: object
      additionalProperties: false
      required:
        - endpoint
        - label
        - query
        - tabId
      properties:
        endpoint:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: URL of the SPARQL endpoint
        label:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          maxLength: 500
          description: A label for the SPARQL query
        query:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: The SPARQL query string
        tabId:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          description: ID of the SPARQL editor tab

    DatasetFilterContent:
      type: object
      additionalProperties: false
      required:
        - label
        - filters
      properties:
        label:
          allOf:
            - $ref: '#/components/schemas/NonBlankString'
          maxLength: 500
          description: A label for the dataset filters
        filters:
          type: object
          minProperties: 1
          additionalProperties: false
          description: The dataset filters
          properties:
            facets:
              type: object
              minProperties: 1
              additionalProperties:
                type: array
                minItems: 1
                items:
                  $ref: '#/components/schemas/NonBlankString'
              description: A map of categorical facet names to the list of selected string values for each facet.
            numericFacets:
              type: object
              minProperties: 1
              additionalProperties:
                type: array
                minItems: 1
                items:
                  type: integer
              description: A map of numeric facet names to the list of selected integer values for each facet.

    dispatcherDecisionRequest:
      type: object
      required:
        - type
        - operation
        - objectId
        - payload
      properties:
        type:
          type: string
          enum: [ application ]
        operation:
          type: string
          enum: [ decision ]
        objectId:
          type: string
          minLength: 1
        itbId:
          type: string
          description: ITB Identifier
        payload:
          type: object
          required:
            - application_type
            - status
            - decisions
          properties:
            application_type:
              type: string
              enum: [ DATA_ACCESS_APPLICATION, DATA_REQUEST_APPLICATION ]
            status:
              type: string
              minLength: 1
            decisions:
              type: array
              minItems: 1
              items:
                type: object
                required:
                  - dataset_id
                  - decision
                properties:
                  dataset_id:
                    type: string
                    minLength: 1
                  decision:
                    type: string
                    minLength: 1
                  decision_file:
                    type: string
                    format: byte
                    description: "Base64-encoded Decision PDF file"
                  decision_reason:
                    type: string
                    maxLength: 2000
                    description: The reason for the decision taken by the reviewer.
                  support_file:
                    type: string
                    format: byte
                    description: "Base64-encoded Support PDF file"
                  translatedFields:
                    type: object
                    description: Translated fields data


    dispatcherPermitRequest:
      type: object
      required:
        - type
        - operation
        - objectId
        - payload
      properties:
        type:
          type: string
          enum: [ application ]
        operation:
          type: string
          enum: [ permit ]
        objectId:
          type: string
          minLength: 1
        itbId:
          type: string
          description: ITB Identifier
        payload:
          type: object
          required:
          - application_type
          - status
          - permits
          properties:
            application_type:
              type: string
              enum: [ DATA_ACCESS_APPLICATION, DATA_REQUEST_APPLICATION ]
            status:
              type: string
              minLength: 1
            catalog_id:
              type: string
              minLength: 1
              description: Catalog ID
            permits:
              type: array
              minItems: 1
              items:
                type: object
              required:
                - dataset_id
                - permit_status
              properties:
                permit_status:
                  type: string
                  minLength: 1
                dataset_id:
                  type: string
                  minLength: 1
                permit_file:
                  type: string
                  format: byte
                  description: "Base64-encoded Decision PDF file"
                reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                renew_amend_file:
                  type: string
                  format: byte
                  description: "Base64-encoded Decision PDF file"
                rejection_file:
                  type: string
                  format: byte
                  description: "Base64-encoded Decision PDF file"
                rejection_reason:
                  type: string
                  minLength: 1
                  maxLength: 2000
                revocation_file:
                  type: string
                  format: byte
                  description: "Base64-encoded Decision PDF file"
                permit_start_date:
                  type: string
                  description: Permit start date
                permit_expiration_date:
                  type: string
                  description: Permit expiration date
                permit_reference_number:
                  type: string
                  description: Permit reference number
                permit_contact_details:
                  type: string
                  description: Permit contact details
                translatedFields:
                  type: object
                  description: Translated fields data

    dispatcherStatusRequest:
      type: object
      required:
        - type
        - operation
        - objectId
        - payload
      properties:
        type:
          type: string
          enum: [ application ]
        operation:
          type: string
        objectId:
          type: string
          minLength: 1
        payload:
          type: object
          required:
            - application_type
            - status
          properties:
            applicationType:
              type: string
              enum: [ DATA_ACCESS_APPLICATION, DATA_REQUEST_APPLICATION ]
            status:
              type: string
              minLength: 1
            statusPayload:
              type: object
            catalog_id:
              type: string
              description: ID of the catalogue


    DispatcherMessage:
      type: object
      properties:
        application_id:
          type: string
          description: ID of the application
        data_permit_id:
          type: string
          description: ID of the associated data permit
        catalog_ids:
          type: array
          items:
            type: string
          description: List of related catalog IDs
        status:
          type: string
          description: Current status of the dispatch result
      required:
        - application_id
        - data_permit_id
        - catalog_ids
        - status

    DispatcherMessages:
      type: array
      items:
        $ref: '#/components/schemas/DispatcherMessage'

    DeleteApplicationResponse:
      type: object
      properties:
        success:
          type: boolean
          description: Indicates whether the operation was successful
        result:
          type: object
          properties:
            id:
              type: string
              description: ID of the deleted application

    Distribution:
      type: object
      properties:
        distribution_id:
          type: string
          format: uuid
          description: ID of the distribution
      required:
        - distribution_id

    DatasetItem:
      type: object
      properties:
        dataset_id:
          type: string
          format: uuid
          description: ID of the dataset
        catalog_id:
          type: string
          format: uuid
          description: ID of the catalog
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/Distribution'
        catalog_languages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLanguageItem'
      required:
        - dataset_id
        - catalog_id
        - distributions

    CatalogLanguageItem:
      type: object
      properties:
        id:
          type: string
          description: Language identifier
        label:
          type: string
          description: Human readable language label
        resource:
          type: string
          description: Language authority resource URI
      required:
        - id
        - label
        - resource

    CreateDataRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the request
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/DatasetItem'
        inputLanguage:
          type: string
          description: The input language of the user
      required:
        - title
        - datasets

    CreateDataResponse:
      type: object
      properties:
        result_message:
          type: string
          description: A message describing the result of the operation
        id:
          type: string
          description: ID of the newly created document

    ApplicationItem:
      type: object
      properties:
        application_id:
          type: string
          pattern: "^[a-fA-F0-9]{24}$"
          description: ID of the application
      required:
        - application_id

    UpdateDistribution:
      type: object
      properties:
        distribution_id:
          type: string
          format: uuid
          description: ID of the distribution
      required:
        - distribution_id

    UpdateDatasetItem:
      type: object
      properties:
        dataset_id:
          type: string
          format: uuid
          description: ID of the dataset
        catalog_id:
          type: string
          format: uuid
          description: ID of the catalog
        distributions:
          type: array
          items:
            $ref: '#/components/schemas/UpdateDistribution'
        catalog_languages:
          type: array
          items:
            $ref: '#/components/schemas/CatalogLanguageItem'
      required:
        - dataset_id
        - catalog_id
        - distributions

    UpdateDatasetRequest:
      type: object
      properties:
        applications:
          type: array
          items:
            $ref: '#/components/schemas/ApplicationItem'
        datasets:
          type: array
          items:
            $ref: '#/components/schemas/UpdateDatasetItem'
      required:
        - applications
        - datasets

    ApplicationSummary:
      type: object
      properties:
        _id:
          type: string
          format: uuid
          description: Unique identifier of the application
        version:
          type: string
          description: Version of the application
        title:
          type: string
          description: Title of the application
      required:
        - _id
        - version
        - title

    UpdateDatasetResponse:
      type: array
      items:
        $ref: '#/components/schemas/ApplicationSummary'

    DeleteDatasetItem:
      type: object
      additionalProperties: false
      properties:
        dataset_id:
          type: string
          description: Unique identifier of the dataset
      required:
        - dataset_id

    DeleteDatasetItemList:
      type: array
      items:
        $ref: '#/components/schemas/DeleteDatasetItem'

    DatasetDistributionItem:
      type: object
      additionalProperties: false
      properties:
        dataset_id:
          type: string
          description: Unique identifier of the dataset
        distribution_id:
          type: string
          description: Unique identifier of the distribution
      required:
        - dataset_id
        - distribution_id

    DeleteDatasetDistributionItemList:
      type: array
      items:
        $ref: '#/components/schemas/DatasetDistributionItem'

    PutStatusRequest:
      type: object
      properties:
        status:
          type: string
          minLength: 1
          description: Status code or label (must be at least 1 character)
        comment:
          type: string
          description: Optional comment providing additional information
        renew_amend_file:
          type: string
          format: byte
          description: Optional base64-encoded PDF uploaded by the user for renewal/amendment requests
      required:
        - status

    ChangeTitleRequest:
      type: object
      properties:
        title:
          type: string
          description: Title of the object
      required:
        - title

    TranslationCallbackPayload:
      type: object
      required:
        - id
        - data
        - dict
      properties:
        id:
          type: string
          description: Mongo ID of the application
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            applicationId:
              type: string
            applicationType:
              type: string
            documentName:
              type: string
            defaultLanguage:
              type: string
            targetLanguages:
              type: array
              items:
                type: string
        dict:
          type: object
          description: Translation content for each section or file
          additionalProperties:
            type: object
            additionalProperties:
              type: object
              required:
                - translations
              properties:
                value:
                  type: string
                  description: Original text (form-only)
                sourceLanguage:
                  type: string
                  description: Source language of the content
                targetLanguages:
                  type: array
                  items:
                    type: string
                translations:
                  type: object
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: number

    DdaPayload:
      type: object
      description: The dataset description assistant payload saved per authenticated user.
      additionalProperties: false
      required: [ datasetDescriptionAssistantAccessLevel, datasetDescriptionAssistantLanguage, datasetDescriptionAssistantFormData ]
      properties:
        datasetDescriptionAssistantAccessLevel:
          type: string
          nullable: true
          description: Access level of the dataset (e.g., "public", "restricted"). May be null.
        datasetDescriptionAssistantLanguage:
          type: string
          nullable: true
          description: Language code (e.g., "en", "el"). May be null.
        datasetDescriptionAssistantFormData:
          type: object
          default: { }
          description: Arbitrary object representing the form data.
          additionalProperties: true

    logLevelResponse:
      type: object
      properties:
        message:
          type: string
          example: Log level for root changed to DEBUG
    logLevelRequest:
      type: object
      properties:
        error:
          type: string
          example: "Missing 'logger' or 'level' parameter"
    logLevelErrorResponse:
      type: object
      properties:
        error:
          type: string
          example: "Logger not found: com.example.MyClass"
    logLevelErrorResponse500:
      type: object
      properties:
        error:
          type: string
          example: "Error changing log level: Level not recognized"

    # -------------------------------------------------------------------------
    # Collaboration schemas
    # -------------------------------------------------------------------------
    CollaboratorEntry:
      type: object
      description: Represents a collaborator or pending invite on an application.
      properties:
        _id:
          type: string
          description: MongoDB document ID
        applicationId:
          type: string
        applicationType:
          type: string
          enum: [DATA_ACCESS_APPLICATION, DATA_REQUEST_APPLICATION]
        invitedEmail:
          type: string
          format: email
        collaboratorUserId:
          type: string
          description: ECAS ID of the collaborator (null until they log in)
        collaboratorUserName:
          type: string
          description: Persisted collaborator name used for list search and sorting
        role:
          type: string
          enum: [OWNER, EDITOR]
        invitationStatus:
          type: string
          enum: [PENDING, ACCEPTED, REJECTED]
        invitedBy:
          type: string
          description: ECAS ID of the user who sent the invitation
        createdAt:
          type: string
          format: date-time
        acceptedAt:
          type: string
          format: date-time
        rejectedAt:
          type: string
          format: date-time

    CollaboratorInviteRequest:
      type: object
      required:
        - invitedEmail
        - applicationType
      properties:
        invitedEmail:
          type: string
          format: email
          description: Email address of the user to invite
        applicationType:
          type: string
          enum: [DATA_ACCESS_APPLICATION, DATA_REQUEST_APPLICATION]
          description: Type of the application

    OwnershipRequestCreateRequest:
      type: object
      required:
        - justification
      properties:
        justification:
          type: string
          description: Justification entered by the editor when requesting ownership

    OwnershipRequestEntry:
      type: object
      description: Represents a pending ownership transfer request raised by an editor.
      properties:
        _id:
          type: string
          description: MongoDB document ID
        application_id:
          type: string
          description: Application identifier
        applicationType:
          type: string
          enum: [DATA_ACCESS_APPLICATION, DATA_REQUEST_APPLICATION]
        userId:
          type: string
          description: ECAS ID of the editor requesting ownership
        userName:
          type: string
          description: Persisted username of the editor requesting ownership
        justification:
          type: string
        createdAt:
          type: string
          format: date-time

    # -------------------------------------------------------------------------
    # Section locking schemas
    # -------------------------------------------------------------------------
    LockRequest:
      type: object
      required:
        - sessionId
      properties:
        sessionId:
          type: string
          description: UUID uniquely identifying the browser tab session

    LockResponse:
      type: object
      properties:
        locked:
          type: boolean
        lockOwnerUserId:
          type: string
        lockOwnerSessionId:
          type: string
        primarySectionId:
          type: string
          description: The primary section the user is editing (the one they navigated to)
        acquiredAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
        lockedSections:
          type: array
          description: All sections locked as part of the lock group
          items:
            $ref: '#/components/schemas/SectionLock'

    LockConflictResponse:
      type: object
      properties:
        locked:
          type: boolean
          example: false
        reason:
          type: string
          description: Human-readable reason why acquisition failed
        lockOwnerUserId:
          type: string
          description: ECAS ID of the current lock holder
        primarySectionId:
          type: string
          description: The section that caused the conflict (may be a dependent lock)
        expiresAt:
          type: string
          format: date-time

    SectionLock:
      type: object
      description: An active section edit lock document.
      properties:
        _id:
          type: string
        applicationType:
          type: string
        applicationId:
          type: string
        sectionId:
          type: string
          description: Section identifier (section1 through section10)
        lockOwnerUserId:
          type: string
        lockOwnerSessionId:
          type: string
        primarySectionId:
          type: string
          description: The primary section that triggered this lock group
        acquiredAt:
          type: string
          format: date-time
        lastHeartbeatAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time

    SwitchLockRequest:
      type: object
      required:
        - sessionId
        - newSectionId
      properties:
        sessionId:
          type: string
          description: UUID uniquely identifying the browser tab session
        newSectionId:
          type: string
          description: The section to navigate to (e.g. section4)

    SwitchLockResponse:
      type: object
      properties:
        locked:
          type: boolean
        primarySectionId:
          type: string
          description: The new primary section
        lockOwnerUserId:
          type: string
        expiresAt:
          type: string
          format: date-time
        lockedSections:
          type: array
          description: All sections now locked for this session
          items:
            $ref: '#/components/schemas/SectionLock'
        releasedSections:
          type: array
          description: Sections released during the switch
          items:
            type: string

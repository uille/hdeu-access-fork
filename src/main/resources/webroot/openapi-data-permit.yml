      security:
        - BearerAuth: [ ]
      tags:
        - Data access application
      parameters:
        - name: data_id
          in: path
          description: ID of the file
          required: true
          schema:
            type: string
            minLength: 1
        - name: application_id
          in: path
          description: ID of the application
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully uploaded the multipart file to the hub-store
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
        '500':
          description: Internal Server Error
    delete:
